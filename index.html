<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Willow 💖 Will You Be My Valentine?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Shown ONLY on desktop/tablet -->
  <section class="not-mobile" aria-live="polite">
    <h1>📱 Mobile Only</h1>
    <p>Hey! This page is made for phones.</p>
    <p>Please open it on your phone to see the surprise 💕</p>
  </section>

  <!-- Shown ONLY on mobile -->
  <main class="card mobile-only">
    <div class="hearts" aria-hidden="true">💗 💘 💞 💓</div>

    <h1>Hey Girlie 🌷</h1>
    <p class="subtitle">Sorry this took so long queen</p>

    <div class="question">
      <p>
        Willow Christeson,<br />
        will you be my <span class="highlight">Valentine</span>? 💕
      </p>
    </div>

    <div class="buttons">
      <button id="yesBtn" class="btn yes">YES 💝</button>
      <button id="noBtn" class="btn no"> No :(</button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <footer class="footer">
      <small>Blood Sweat and Tears were put into this ❤️</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
